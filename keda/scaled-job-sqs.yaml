apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "dummy"
  AWS_SECRET_ACCESS_KEY: "dummy"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: demo-sqs-job
spec:
  jobTargetRef:
    parallelism: 1
    completions: 1
    activeDeadlineSeconds: 600
    backoffLimit: 2
    template:
      spec:
        serviceAccountName: keda-job
        restartPolicy: Never
        containers:
        - name: handler
          image: keda-demo:latest
          imagePullPolicy: Never
          env:
          - name: AWS_ENDPOINT_URL
            value: "http://localstack.localstack:4566"
          - name: AWS_REGION
            value: "us-east-1"
          - name: QUEUE_NAME
            value: "demo-queue"
          - name: MESSAGE_BODY
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['message-body']
          envFrom:
          - secretRef:
              name: aws-credentials
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
  pollingInterval: 5
  minReplicaCount: 0
  maxReplicaCount: 10
  triggers:
  - type: aws-sqs-queue
    metadata:
      queueURL: "http://localstack.localstack:4566/000000000000/demo-queue"
      awsRegion: "us-east-1"
      identityOwner: "operator"
      messageDelay: "0"
      visibilityTimeout: "300"
      durationBeforeDeletion: "0"
    authenticationRef:
      name: aws-credentials-trigger
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: aws-credentials-trigger
spec:
  secretTargetRef:
  - parameter: awsAccessKeyId
    name: aws-credentials
    key: AWS_ACCESS_KEY_ID
  - parameter: awsSecretAccessKey
    name: aws-credentials
    key: AWS_SECRET_ACCESS_KEY
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keda-job
