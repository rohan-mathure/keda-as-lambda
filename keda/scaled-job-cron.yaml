apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: demo-cron-job
spec:
  jobTargetRef:
    parallelism: 1
    completions: 1
    activeDeadlineSeconds: 600
    backoffLimit: 2
    template:
      spec:
        serviceAccountName: keda-job
        restartPolicy: Never
        containers:
        - name: handler
          image: keda-demo:latest
          imagePullPolicy: Never
          env:
          - name: MESSAGE_BODY
            value: '{"id": 1, "source": "cron-trigger", "message": "Scheduled batch job", "timestamp": "2026-09-17T04:00:00Z"}'
          - name: JOB_TYPE
            value: "batch-report"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
  pollingInterval: 30
  minReplicaCount: 0
  maxReplicaCount: 5
  triggers:
  # Nightly batch: 10 PM - 10:30 PM (every day)
  - type: cron
    metadata:
      timezone: UTC
      start: 0 22 * * *           # 10 PM UTC
      end: 30 22 * * *            # 10:30 PM UTC
      desiredReplicas: "2"        # Run 2 concurrent jobs
  # Alternative: Business hours (Mon-Fri 9 AM - 5 PM UTC)
  # Uncomment to test peak-hour scaling
  # - type: cron
  #   metadata:
  #     timezone: UTC
  #     start: 0 9 * * 1-5
  #     end: 0 17 * * 1-5
  #     desiredReplicas: "5"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keda-job
