apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: demo-cron-job
spec:
  jobTargetRef:
    parallelism: 1
    completions: 1
    activeDeadlineSeconds: 600
    backoffLimit: 2
    template:
      spec:
        serviceAccountName: keda-job
        restartPolicy: Never
        containers:
        - name: handler
          image: keda-demo:latest
          imagePullPolicy: Never
          env:
          - name: MESSAGE_BODY
            value: '{"id": 1, "source": "cron-trigger", "message": "Triggered by KEDA Cron"}'
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
  pollingInterval: 30
  minReplicaCount: 0
  maxReplicaCount: 5
  triggers:
  - type: cron
    metadata:
      timezone: UTC
      start: 0 * * * *
      end: 59 * * * *
      desiredReplicas: "1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keda-job
